@if (isOpen()) {
  @if (position()== 'center') {
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4" (click)="close()">
      <!-- Panel -->
      <section role="dialog" aria-modal="true" (click)="$event.stopPropagation()"
               class="relative w-full overflow-hidden rounded-2xl bg-white shadow-2xl"
               [class.max-w-sm]="size() === 'sm'"
               [class.max-w-lg]="size() === 'md'"
               [class.max-w-3xl]="size() === 'lg'">
        <div class="h-1.5 bg-gradient-to-r from-cyan-500 to-cyan-400"></div>
  
        <header class="flex items-center justify-between gap-4 border-b border-slate-200 px-6 py-4">
          <h2 class="text-lg font-bold text-slate-900">{{ title() }}</h2>
        </header>
  
        <div class="px-6 py-5 text-sm leading-relaxed text-slate-600">
          <ng-content/>
        </div>
  
        @if (showFooter()) {
          <footer class="flex items-center justify-end gap-3 border-t border-slate-200 px-6 py-4">
            <ng-content select="[modal-footer]"/>
          </footer>
        }
      </section>
    </div>
  }@else{
    <div class="fixed inset-0 z-50" (click)="close()"></div>
    <!-- Panel -->
    <section role="dialog" aria-modal="true" (click)="$event.stopPropagation()"
              class="absolute right-0 top-full z-40 mt-2 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl"
              [class.w-80]="size() === 'sm'"
              [class.w-96]="size() === 'md'"
              [class.w-[28rem]]="size() === 'lg'">
      <div class="h-1.5 bg-gradient-to-r from-cyan-500 to-cyan-400"></div>

      <header class="flex items-center justify-between gap-4 border-b border-slate-200 px-6 py-4">
        <h2 class="text-lg font-bold text-slate-900">{{ title() }}</h2>
      </header>

      <div class="px-6 py-5 text-sm leading-relaxed text-slate-600">
        <ng-content/>
      </div>

      @if (showFooter()) {
        <footer class="flex items-center justify-end gap-3 border-t border-slate-200 px-6 py-4">
          <ng-content select="[modal-footer]"/>
        </footer>
      }
    </section>
  }
}
