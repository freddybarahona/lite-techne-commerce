<footer class="mt-auto">
  <div class="flex flex-wrap items-start justify-around gap-8 bg-[#1e1e1e] px-5 py-8 text-white">
    <section class="min-w-50">
      <button type="button" (click)="toggle('industry')" [attr.aria-expanded]="industryVisible" class="cursor-pointer text-left text-lg font-bold transition-colors hover:text-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400">NovaMarket</button>
      @if (industryVisible) { <p class="mt-2 text-sm text-neutral-300">Ecommerce Administrativo de todo tipo</p> }
    </section>

    <section class="min-w-50">
      <button type="button" (click)="toggle('information')" [attr.aria-expanded]="informationVisible" class="cursor-pointer text-left text-base font-bold transition-colors hover:text-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400">Información</button>
      @if (informationVisible) {
        <div class="mt-2 space-y-1 text-sm text-neutral-300"><p>Términos y Condiciones</p><p>Privacidad</p><p>Soporte</p></div>
      }
    </section>

    <section class="min-w-50">
      <button type="button" (click)="toggle('social')" [attr.aria-expanded]="socialVisible" class="cursor-pointer text-left text-base font-bold transition-colors hover:text-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400">Redes Sociales</button>
      @if (socialVisible) {
        <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook de NovaMarket" class="mt-3 inline-flex text-white transition-colors hover:text-cyan-400">
          <svg viewBox="0 0 24 24" fill="currentColor" class="size-6" aria-hidden="true"><path d="M13.5 21v-8h2.75l.41-3.2H13.5V7.76c0-.93.26-1.56 1.59-1.56h1.7V3.34A22.7 22.7 0 0 0 14.3 3C11.84 3 10.15 4.5 10.15 7.27V9.8H7.5V13h2.65v8h3.35Z" /></svg>
        </a>
      }
    </section>
  </div>

  <button type="button" (click)="messageVisible = !messageVisible" class="block w-full bg-[#121212] px-4 py-2.5 text-center text-sm text-neutral-400 transition-colors hover:text-neutral-200 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-cyan-400">
    © {{ currentYear }} NovaMarket - Todos los derechos reservados. @if (messageVisible) { Holi XD }
  </button>
</footer>
