<header class="shadow-sm">
  <div class="flex h-16 items-center justify-between bg-white px-5 sm:px-8">
    <a routerLink="/" aria-label="NovaMarket, ir al inicio" class="flex items-center gap-2.5 text-slate-900 transition-opacity hover:opacity-80">
      <span class="grid size-10 place-items-center rounded-lg text-cyan-600" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349M3.75 21V9.349m0 0a3.001 3.001 0 0 0 3.75-.615A2.993 2.993 0 0 0 9.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 0 0 2.25 1.016c.896 0 1.7-.393 2.25-1.015a3.001 3.001 0 0 0 3.75.614m-16.5 0a3.004 3.004 0 0 1-.621-4.72l1.189-1.19A1.5 1.5 0 0 1 5.378 3h13.243a1.5 1.5 0 0 1 1.06.44l1.19 1.189a3 3 0 0 1-.621 4.72M6.75 18h3.75a.75.75 0 0 0 .75-.75V13.5a.75.75 0 0 0-.75-.75H6.75a.75.75 0 0 0-.75.75v3.75c0 .414.336.75.75.75Z" />
        </svg>
      </span>
      <span class="text-[22px] font-bold tracking-tight">Lite Techne</span>
    </a>

    <ul class="mx-auto flex max-w-3xl flex-wrap items-center justify-center gap-2 sm:justify-around sm:gap-5">
      <li><a routerLink="/home" routerLinkActive="bg-cyan-500 !text-slate-950" [routerLinkActiveOptions]="{ exact: true }" class="block rounded-lg px-4 py-2 text-sm font-extrabold text-gray transition-colors hover:text-cyan-400">Home</a></li>
      <li><a routerLink="/products" routerLinkActive="bg-cyan-500 !text-slate-950" class="block rounded-lg px-4 py-2 text-sm font-extrabold text-gray transition-colors hover:text-cyan-400">Productos</a></li>
      <li><a routerLink="/about" routerLinkActive="bg-cyan-500 !text-slate-950" class="block rounded-lg px-4 py-2 text-sm font-extrabold text-gray transition-colors hover:text-cyan-400">Sobre nosotros</a></li>
      <li><a routerLink="/contact" routerLinkActive="bg-cyan-500 !text-slate-950" class="block rounded-lg px-4 py-2 text-sm font-extrabold text-gray transition-colors hover:text-cyan-400">Contacto</a></li>
    </ul>


    <a routerLink="/auth/login" class="inline-flex items-center gap-2 rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25" />
      </svg>
      Login
    </a>
  </div>
</header>
